<!DOCTYPE html>
<html>
<head>
    <title>Village Feast Admin Login</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 300px;
            text-align: center;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            background: #263238;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Village Feast</h2>
    <h3>Admin Login</h3>

    <form method="POST">
        <input type="password"
               name="password"
               placeholder="Enter Admin Password"
               required>

        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
